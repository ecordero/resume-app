<!-- Navigation controls -->
<div class="fixed top-4 right-4 z-50 print:hidden">
  <div
    class="flex gap-2 rounded-lg border border-gray-300 bg-white p-2 shadow-lg"
  >
    @if (isDevelopment) {
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-700">Real</span>
        <label class="relative inline-flex cursor-pointer items-center">
          <input
            type="checkbox"
            [checked]="resumeDataService.useFakeData()"
            (change)="toggleDataSource()"
            class="peer sr-only"
          />
          <div
            class="peer h-6 w-11 rounded-full bg-gray-200 peer-focus:ring-4 peer-focus:ring-blue-300 peer-focus:outline-none after:absolute after:start-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:after:translate-x-full peer-checked:after:border-white rtl:peer-checked:after:-translate-x-full"
            [ngClass]="{
              'peer-checked:bg-red-500': resumeDataService.useFakeData(),
              'bg-green-500': !resumeDataService.useFakeData()
            }"
          ></div>
        </label>
        <span class="text-sm text-gray-700">Fake</span>
      </div>
    }
    <button
      (click)="navigateToAtsColumns()"
      class="rounded border bg-gray-100 px-3 py-1 text-sm text-gray-700 transition-colors hover:bg-blue-500 hover:text-white"
    >
      ATS Skill Cols
    </button>
    <button
      disabled
      class="rounded border bg-gray-300 px-3 py-1 text-sm text-gray-500 cursor-not-allowed"
    >
      ATS Skill Groups
    </button>
    <button
      (click)="navigateToWeb()"
      class="rounded border bg-gray-100 px-3 py-1 text-sm text-gray-700 transition-colors hover:bg-blue-500 hover:text-white"
    >
      Web
    </button>
  </div>
</div>

<main
  class="mx-auto mt-5 mb-20 max-w-6xl rounded-lg bg-white p-6 pt-15 print:mt-0 print:mr-3 print:mb-0 print:ml-3 print:max-w-5xl print:pt-5 print:pr-8 print:pl-8 print:shadow-none"
>
  @if (resumeData) {
    <app-header
      [resumeLocation]="resumeData.location"
      [name]="resumeData.name"
      [title]="resumeData.title"
      [roles]="resumeData.roles"
      [profile]="resumeData.profile"
    >
    </app-header>
    <!-- Skills section above experience -->
    <div class="block">
      <app-expertise
        class="mb-4"
        [skills]="resumeData.expertise"
        [isAtsView]="true"
      ></app-expertise>
      <app-experience [experience]="currentExperience"></app-experience>
    </div>
    <div class="flex gap-10 print:mt-5">
      <app-contact
        class="min-w-1/4 print:flex-grow"
        [contact]="resumeData.contact"
      ></app-contact>
      <app-education
        class="flex-grow"
        [education]="resumeData.education"
      ></app-education>
    </div>
  } @else {
    <div>Loading resume data...</div>
  }
</main>
