<button
  type="button"
  (click)="open()"
  class="rounded border bg-gray-100 px-3 py-1 text-sm text-gray-700 transition-colors hover:bg-blue-500 hover:text-white"
>
  Settings
</button>

<dialog
  #dialog
  class="m-auto w-full max-w-md rounded-lg border border-gray-300 bg-white p-6 text-gray-900 shadow-lg backdrop:bg-black/40"
>
  <h2 class="mb-4 text-lg font-semibold">Settings</h2>

  <label for="dataset-select" class="mb-1 block text-sm font-medium text-gray-700">
    Resume data set
  </label>
  <select
    id="dataset-select"
    [disabled]="resumeDataService.useFakeData()"
    (change)="onSelect($event)"
    class="w-full rounded border border-gray-300 px-2 py-1 text-sm disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-500"
  >
    @for (dataset of resumeDataService.datasets; track dataset.file) {
      <option
        [value]="dataset.file"
        [selected]="dataset.file === resumeDataService.selectedFile()"
      >
        {{ dataset.label }}
      </option>
    }
  </select>
  @if (resumeDataService.useFakeData()) {
    <p class="mt-1 text-sm text-red-600">Turn off Fake data to use this.</p>
  }

  <h3 class="mt-6 mb-1 text-sm font-medium text-gray-700">Add a data set</h3>
  <ol class="list-decimal pl-5 text-sm text-gray-700">
    <li>Add the JSON file to <code>public/data/</code>.</li>
    <li>
      Add an entry to <code>datasets</code> in
      <code>src/environments/environment.ts</code>.
    </li>
  </ol>

  <div class="mt-6 flex justify-end">
    <button
      type="button"
      (click)="close()"
      class="rounded border bg-gray-100 px-3 py-1 text-sm text-gray-700 transition-colors hover:bg-blue-500 hover:text-white"
    >
      Close
    </button>
  </div>
</dialog>
