<app-nav (dataSourceChange)="getResumeData()" />

<main class="mx-auto mt-5 mb-20 max-w-6xl rounded-lg bg-white p-6 pt-15">
  @if (resumeData) {
    <app-header
      [resumeLocation]="resumeData.location"
      [name]="resumeData.name"
      [title]="resumeData.title"
      [roles]="resumeData.roles"
      [profile]="resumeData.profile"
    >
    </app-header>
    <div class="flex gap-10">
      <app-expertise
        class="min-w-1/4"
        [skills]="resumeData.expertise"
      ></app-expertise>
      <app-experience [experience]="currentExperience"></app-experience>
    </div>
    <div class="flex gap-10">
      <app-contact
        class="min-w-1/4"
        [contact]="resumeData.contact"
      ></app-contact>
      <app-education
        class="flex-grow"
        [education]="resumeData.education"
      ></app-education>
    </div>
  } @else {
    <div>Loading resume data...</div>
  }
</main>
