<header class="mb-8 flex-col justify-between gap-8 align-bottom">
  <div class="mb-3 min-w-xl">
    <h1 class="border-b-2 text-6xl font-semibold tracking-wide">
      {{ name }}
    </h1>
  </div>
  <div
    class="flex justify-between gap-10 leading-5.5 text-gray-600"
  >
    <div class="min-w-2/5">
      <h2
        class="mb-5 text-2xl tracking-wide"
      >
        @for (role of roles; track $index) {
          {{ role }}<br />
        }
      </h2>
      <p class="mb-2 text-xl">{{ resumeLocation }}</p>
    </div>
    <app-profile [profile]="profile"></app-profile>
  </div>
</header>
