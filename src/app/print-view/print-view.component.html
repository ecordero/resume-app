<!-- Navigation controls -->
<div class="fixed top-4 right-4 z-50 print:hidden">
  <div class="flex gap-2 bg-white border border-gray-300 rounded-lg shadow-lg p-2">
    @if (isDevelopment) {
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-700">Real</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            [checked]="resumeDataService.useFakeData()"
            (change)="toggleDataSource()"
            class="sr-only peer"
          >
          <div [class]="'w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[\'\'] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all ' + (resumeDataService.useFakeData() ? 'peer-checked:bg-red-500' : 'bg-green-500')"></div>
        </label>
        <span class="text-sm text-gray-700">Fake</span>
      </div>
    }
    <button
      (click)="navigateBack()"
      class="px-3 py-1 text-sm rounded border bg-gray-100 text-gray-700 hover:bg-blue-500 hover:text-white transition-colors"
    >
      ← Back to Resume
    </button>
  </div>
</div>

<main
  class="mx-auto mt-5 mb-20 max-w-6xl rounded-lg bg-white p-6 pt-15 print:mt-0 print:mr-3 print:ml-3 print:max-w-5xl print:pt-5 print:pr-8 print:pl-8 print:shadow-none"
>
  @if (resumeData) {
    <app-header
      [resumeLocation]="resumeData.location"
      [name]="resumeData.name"
      [title]="resumeData.title"
      [roles]="resumeData.roles"
      [profile]="resumeData.profile"
    >
    </app-header>
    <!-- Skills section above experience -->
    <div class="block">
      <app-expertise
        class="mb-4"
        [skills]="resumeData.expertise"
        [isPrintView]="true"
      ></app-expertise>
      <app-experience [experience]="currentExperience"></app-experience>
    </div>
    <div class="flex gap-10 print:mt-5">
      <app-contact
        class="min-w-1/4 print:flex-grow"
        [contact]="resumeData.contact"
      ></app-contact>
      <app-education
        class="flex-grow"
        [education]="resumeData.education"
      ></app-education>
    </div>
  } @else {
    <div>Loading resume data...</div>
  }
</main>
