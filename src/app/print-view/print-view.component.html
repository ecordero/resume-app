<!-- Back to regular view button -->
<div class="fixed top-4 right-4 z-50 print:hidden">
  <button
    (click)="navigateBack()"
    class="px-3 py-1 text-sm rounded border bg-gray-100 text-gray-700 hover:bg-blue-500 hover:text-white transition-colors shadow-lg"
  >
    ← Back to Resume
  </button>
</div>

<main
  class="mx-auto mt-5 mb-20 max-w-6xl rounded-lg bg-white p-6 pt-15 print:mt-0 print:mr-3 print:ml-3 print:max-w-5xl print:pt-5 print:pr-8 print:pl-8 print:shadow-none"
>
  @if (resumeData) {
    <app-header
      [resumeLocation]="resumeData.location"
      [name]="resumeData.name"
      [title]="resumeData.title"
      [roles]="resumeData.roles"
      [profile]="resumeData.profile"
    >
    </app-header>
    <!-- Skills section above experience -->
    <div class="block">
      <app-expertise
        class="mb-4"
        [skills]="resumeData.expertise"
      ></app-expertise>
      <app-experience [experience]="currentExperience"></app-experience>
    </div>
    <div class="flex gap-10 print:mt-5">
      <app-contact
        class="min-w-1/4 print:flex-grow"
        [contact]="resumeData.contact"
      ></app-contact>
      <app-education
        class="flex-grow"
        [education]="resumeData.education"
      ></app-education>
    </div>
  } @else {
    <div>Loading resume data...</div>
  }
</main>
