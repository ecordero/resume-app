<section id="areas-of-expertise" class="mb-0">
  <h3
    class="mb-2 border-b-1 text-xl font-semibold tracking-wide uppercase print:text-lg"
  >
    Key Skills
  </h3>

  <!-- Default view - Individual skills with ratings -->
  <div [class]="isAtsView ? 'hidden' : 'block'">
    <div class="flex-col gap-y-5">
      @for (key of skillsKeys; track $index) {
        <ul class="mb-5 align-middle">
          @for (skill of skills[key]; track $index) {
            <li class="flex justify-between gap-0 print:text-sm">
              {{ skill.name }}
            </li>
          }
        </ul>
      }
    </div>
  </div>

  <!-- ATS view - Single column inline bullet list -->
  <div [class]="isAtsView ? 'block' : 'hidden'">
    <ul class="mb-6 ml-4 list-none p-4 print:text-sm">
      @for (key of skillsKeys; track $index) {
        <li class="inline">
          {{ getSkillsAsCommaSeparatedList(key) }}
          @if ($index < skillsKeys.length - 1) {
            <span class="mx-2 text-lg font-bold print:text-base">•</span>
          }
        </li>
      }
    </ul>
  </div>
</section>
