<section id="experience">
  <h3 class="mb-10 border-b-1 text-xl font-semibold tracking-wide uppercase">
    {{ headerText }}
  </h3>
  @for (pos of experience; track $index) {
    <div>
      <div class="mb-2 flex justify-between gap-5 border-b-1 border-gray-300">
        <h4 class="min-w-1/3 font-semibold">
          {{ pos.title }}
        </h4>
        <p class="text-l font-semibold">
          {{ pos.startDate }}&ndash;{{ pos.endDate }}
        </p>
      </div>
      <div class="mb-4 flex gap-7 pb-3">
        <div class="w-1/3">
          <p class="text-l text-sm font-bold text-gray-500">
            {{ pos.company }}
          </p>
          <p class="text-l mb-3 text-sm text-gray-500">
            {{ pos.location }}
          </p>
          <p class="font-serif text-sm tracking-tight text-gray-500 italic">
            {{ pos.summary }}
          </p>
        </div>
        <div class="w-2/3">
          <ul class="ml-4.5 list-disc">
            @for (accomplishment of pos.accomplishments; track $index) {
              <li class="mb-2">{{ accomplishment }}</li>
            }
          </ul>
        </div>
      </div>
    </div>
  }
</section>
