<section id="experience">
  <h3
    class="mb-5 border-b-1 text-xl font-semibold tracking-wide uppercase print:text-lg"
  >
    {{ headerText() }}
  </h3>
  @for (pos of experience(); track $index) {
    <div
      id="{{ positionId(pos) }}"
      [class]="breakBefore()[$index] ? 'print:break-before-page' : ''"
    >
      <div
        class="print: mb-2 flex justify-between gap-5 border-b-1 border-gray-300 print:break-after-avoid print:border-current"
      >
        <h4 class="min-w-1/3 font-semibold print:text-sm">
          {{ pos.title }}
        </h4>
        <p class="text-l font-semibold print:text-sm">
          {{ pos.startDate }}&ndash;{{ pos.endDate }}
        </p>
      </div>
      <div class="mb-2 flex">
        <div class="w-1/3">
          <p class="text-l text-sm font-bold print:text-xs">
            {{ pos.company }}
          </p>
          <p class="text-l mb-3 text-sm print:text-xs">
            {{ pos.location }}
          </p>
        </div>
        <div class="w-2/3">
          <p class="font-serif text-sm tracking-tight italic print:text-xs">
            {{ pos.summary }}
          </p>
        </div>
      </div>
      <div class="mb-4 pb-3">
        <ul class="ml-4.5 list-disc print:text-sm">
          @for (accomplishment of pos.accomplishments; track $index) {
            <li class="mb-2 print:mb-1 print:text-sm">{{ accomplishment }}</li>
          }
        </ul>
      </div>
    </div>
  }
</section>
